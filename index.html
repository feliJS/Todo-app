<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script defer src="./script.js"></script>
    <title>To do app</title>
</head>

<body>
    <header>
        <h1 id="head-title">My To-do app</h1>
    </header>

    <main>
        <form id="todo-form">
            <label for="todo-input">New task</label>
            <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off" required>

            <button type="submit" id="add-btn">+</button>
        </form>
        <button id="all-tasks">All</button>
        <button id="active-tasks">Active</button>
        <button id="done-tasks">Done</button>

        <p id="error-text"></p>

        <ul id="task-list"></ul>
    </main>

    <footer id="item-counter"></footer>
</body>

</html>
